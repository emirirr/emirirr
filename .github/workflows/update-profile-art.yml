name: Update profile art

# Katkı ısı haritasını her gün yeniden kazır, render eder ve commit'ler.
# Portre ve bilgi kartı statiktir; onları yalnızca yerelde elle güncelle.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~her gün 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    env:
      GH_USERNAME: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: katkı grafiğini güncelle [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
